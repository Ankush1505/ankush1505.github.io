<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<meta name="darkreader-lock">
<meta name="theme-color" content="#070708">
<title>Ankush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
  --bg: #070708;
  --text: #e9edf2;
  --muted: #8b919b;
  --line: #2b2d32;
  --row: #101114;
  --name: #dfe4ea;
  --focus: #e9edf2;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f2f3f5;
  --text: #17181b;
  --muted: #5d636d;
  --line: #cfd3da;
  --row: #e8eaee;
  --name: #23262b;
  --focus: #17181b;
}
html { height: 100%; background: var(--bg); scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 22px;
}
main { width: 100%; max-width: 400px; text-align: center; }
h1 {
  margin: 0;
  font-family: "Allura", "Snell Roundhand", "Brush Script MT", cursive;
  font-weight: 400;
  font-size: clamp(88px, 28vw, 128px);
  line-height: 1.05;
  padding: 0 0.12em 0.1em;
  color: var(--name);
}
.title { margin: 6px 0 0; font-size: 15px; font-weight: 300; letter-spacing: 0.14em; color: var(--muted); }
.links { list-style: none; margin: 44px 0 0; padding: 0; display: grid; gap: 10px; }
.links a {
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 16px 18px;
  background: var(--row);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--text);
  text-decoration: none;
  font-size: 15px;
  font-weight: 500;
}
.links a span { font-weight: 300; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; text-align: right; }
.links a:hover { border-color: var(--muted); }
.links a:focus-visible, .toggle:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.toggle:hover { opacity: 0.8; }
.quote { margin: 40px 0 0; font-size: 14px; font-weight: 300; letter-spacing: 0.08em; color: var(--muted); }
.toggle {
  position: fixed;
  top: calc(14px + env(safe-area-inset-top, 0px));
  right: calc(14px + env(safe-area-inset-right, 0px));
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
  font-size: 20px; line-height: 1;
  background: transparent;
  border: 0;
  border-radius: 50%;
  opacity: 0.45;
  filter: grayscale(1);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
@media (prefers-reduced-motion: no-preference) {
  html, body, .links a, .toggle { transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
  h1 { animation: rise 0.9s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<button class="toggle" id="theme" type="button" aria-label="Switch to light version">☀️</button>
<main>
  <h1>Ankush</h1>
  <p class="title">Ambition, engineered.</p>
  <ul class="links">
    <li><a href="https://github.com/Ankush1505" target="_blank" rel="noopener">GitHub <span>Ankush1505</span></a></li>
    <li><a href="https://www.linkedin.com/search/results/people/?keywords=Ankush%20Sarsswat" target="_blank" rel="noopener">LinkedIn <span>Ankush Sarsswat</span></a></li>
    <li><a href="https://instagram.com/ankush_sars23" target="_blank" rel="noopener">Instagram <span>@ankush_sars23</span></a></li>
  </ul>
  <p class="quote">Built, not borrowed.</p>
</main>
<script>
(function () {
  var root = document.documentElement;
  var btn = document.getElementById("theme");
  var meta = document.querySelector('meta[name="theme-color"]');
  function apply(t) {
    root.setAttribute("data-theme", t);
    btn.textContent = t === "dark" ? "\u2600\uFE0F" : "\uD83C\uDF19";
    btn.setAttribute("aria-label", t === "dark" ? "Switch to light version" : "Switch to dark version");
    if (meta) meta.setAttribute("content", t === "dark" ? "#070708" : "#f2f3f5");
  }
  btn.addEventListener("click", function () {
    apply(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });
  apply("dark");
})();
</script>
</body>
</html>
